<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151619" />
    <title>Qwakk Island</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffd43b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="hud" aria-live="off"></div>
      <div id="overlay">
        <div class="card">
          <div class="title">Qwakk Island</div>
          <div class="sub" id="status">Loading the island...</div>
          <button id="reconnect" type="button" hidden>Reconnect</button>
          <div class="keys">
            <span><b>Click</b> to play</span>
            <span><b>WASD</b> move</span>
            <span><b>Shift</b> sprint</span>
            <span><b>Alt</b> walk</span>
            <span><b>C</b> crouch</span>
            <span><b>Space</b> jump</span>
            <span><b>V</b> swap shoulder</span>
            <span><b>- / =</b> mouse speed</span>
            <span><b>H</b> debug HUD</span>
            <span class="devonly" hidden><b>N / J / L</b> fake lag, jitter, loss</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
