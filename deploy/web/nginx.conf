# qwakk-game-web: serves the Vite build at /game/.
# Included inside the http block of the stock nginx.conf, after mime.types.

# Types the stock mime.types lacks or may lack.
types {
    model/gltf-binary glb;
    model/gltf+json   gltf;
    application/wasm  wasm;
}

# Requests arrive through CapRover's nginx (overlay network), so log the
# real client address from X-Forwarded-For.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;

    server_tokens     off;
    # Relative redirects, so /game -> /game/ stays on qwakk.fun behind the proxy.
    absolute_redirect off;

    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml
                    model/gltf-binary model/gltf+json application/wasm application/octet-stream;
    # Brotli needs the ngx_brotli module, which the stock image does not ship.

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /game/;
    }

    location = /game {
        return 301 /game/;
    }

    # The entry page: always revalidate so a deploy is picked up at once.
    location = /game/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite output with content hashes in the file names.
    location /game/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Models keep fixed names (duck.glb, weapons/*.glb), so revalidate them
    # (ETag makes repeat visits a cheap 304).
    location /game/ {
        index     index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
