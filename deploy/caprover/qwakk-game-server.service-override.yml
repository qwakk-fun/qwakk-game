# Paste into: Apps > qwakk-game-server > App Configs > Service Update Override.
# CapRover reapplies this on every deploy, unlike a one-off `docker service update`.
# Caps the game server so it cannot starve the DEX, the indexer and PostgreSQL on
# the shared 8 GB host. Tune after `npm run bench` and real traffic.
TaskTemplate:
  Resources:
    Limits:
      NanoCPUs: 1500000000      # 1.5 CPUs
      MemoryBytes: 1073741824   # 1 GiB (keep NODE_OPTIONS --max-old-space-size below it)
    Reservations:
      NanoCPUs: 500000000       # 0.5 CPU
      MemoryBytes: 268435456    # 256 MiB
