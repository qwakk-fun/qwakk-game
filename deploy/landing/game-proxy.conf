# Paste into the landing app's nginx template in CapRover:
#   Apps > qwakk-landing > HTTP Settings > Edit Default Nginx Configurations
# Put it inside the main server block (the one with `set $upstream ...` and
# `listen 443 ssl`), directly ABOVE the existing `location / {` line.
# Do not paste it into the small port-80 server block that only redirects to HTTPS.
#
# Why a variable: nginx resolves a literal proxy_pass host at reload time. If
# qwakk-game-web is missing or down, a literal name would fail the reload of
# CapRover's shared nginx and take every site down. With a variable it is
# resolved per request through Docker's DNS (the `resolver 127.0.0.11` line the
# template already has), and a missing service only gives a 502 on /game/.

location = /game {
    return 301 /game/;
}

location /game/ {
    set $qwakk_game_web http://srv-captain--qwakk-game-web:80;
    # No URI part: the request path (/game/...) is passed through unchanged.
    proxy_pass $qwakk_game_web;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
